# Eclipse Mosquitto Configuration for Aqua OS Local Development
# ==============================================================================
# WARNING: DEVELOPMENT ONLY!
# The settings below permit unauthenticated connections on port 1883.
# This configuration is strictly for isolated local offline development.
# DO NOT EXPOSE PORT 1883 TO PUBLIC NETWORKS OR PRODUCTION ENVIRONMENTS.
#
# Production hardening requires:
# 1. TLS listener on port 8883 (with CA certs).
# 2. allow_anonymous false
# 3. password_file /mosquitto/config/password_file
# 4. acl_file /mosquitto/config/acl_file (farm topic isolation)
# See mosquitto.prod.conf.example for the production specification.
# ==============================================================================

listener 1883 0.0.0.0
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
